# Web UIs (when running: docker compose up --build)
# - Qdrant dashboard: http://localhost:6333/dashboard
# - FastAPI Swagger:  http://localhost:8001/docs

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  telegram-bot:
    build: .
    command: python run_telegram_bot.py
    env_file: .env

  ingestion-service:
    build: .
    command: uvicorn services.ingestion_service.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    mem_limit: 2g

  upload-bot:
    build: .
    command: python -m services.upload_bot.main
    env_file: .env
    environment:
      INGESTION_SERVICE_URL: http://ingestion-service:8001
    depends_on:
      ingestion-service:
        condition: service_started

volumes:
  qdrant_data:
