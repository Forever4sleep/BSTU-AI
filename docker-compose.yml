# Usage:
#   cp .env.example .env   # edit: OPENROUTER_API_KEY, bot tokens
#   docker compose up --build
#
# API-only (no bots):  docker compose --profile api up --build
#
# Web UIs:
#   Qdrant:    http://localhost:6333/dashboard
#   Swagger:   http://localhost:8001/docs
#   Open WebUI: http://localhost:3000  (чат, подключён к ingestion-service → OpenRouter)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ingestion-service:
    build: .
    command: uvicorn services.ingestion_service.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: redis://redis:6379/0
      INGESTION_DB_URL: postgresql+asyncpg://bstu:${POSTGRES_PASSWORD:-bstu_dev}@postgres:5432/bstu_ai
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-bstu-ai-rag}
    ports:
      - "8001:8001"
    volumes:
      - materials_data:/app/data/materials
    depends_on:
      - qdrant
      - redis
      - postgres

  celery-worker:
    build: .
    command: celery -A services.ingestion_service.celery_app worker --loglevel=info
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - materials_data:/app/data/materials
    depends_on:
      - qdrant
      - redis
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-bot:
    build: .
    command: python run_telegram_bot.py
    env_file: .env
    depends_on:
      - ingestion-service

  upload-bot:
    build: .
    command: python -m services.upload_bot.main
    env_file: .env
    environment:
      INGESTION_SERVICE_URL: http://ingestion-service:8001
    depends_on:
      - ingestion-service

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bstu_ai
      POSTGRES_USER: bstu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bstu_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    env_file: .env
    environment:
      OPENAI_API_BASE_URLS: http://ingestion-service:8001/v1
      OPENAI_API_KEYS: ${OPENROUTER_API_KEY}
      ENABLE_SIGNUP: "true"
    depends_on:
      - ingestion-service
    restart: unless-stopped

volumes:
  qdrant_data:
  materials_data:
  open_webui_data:
  postgres_data:
